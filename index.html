<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفيلسوف الرقمي - ابن سينا</title>
    <style>
        body {
            background: #0d1117 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        #chat-window {
            flex: 1;
            margin-top: 50px; 
            margin-bottom: 160px; 
            padding: 0 10%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg { 
            padding: 15px 25px; 
            border-radius: 20px; 
            max-width: 80%; 
            line-height: 1.8; 
            font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            white-space: pre-wrap;
            backdrop-filter: blur(3px);
        }

        .ai-msg { 
            background: rgba(13, 17, 23, 0.9); 
            border: 2px solid #f1c40f; 
            color: #f1c40f; 
            align-self: flex-start; 
        }

        .user-msg { 
            background: rgba(31, 111, 235, 0.8); 
            color: white; 
            align-self: flex-end; 
            border: 1px solid #58a6ff;
        }

        .container-bottom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-area {
            width: 55%; 
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 35px;
            padding: 8px 25px;
            border: 1px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.2);
        }

        input {
            background: transparent;
            border: none;
            color: #f1c40f; 
            padding: 10px;
            width: 100%;
            font-size: 1.2rem;
            outline: none;
        }

        .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #f1c40f;
            font-size: 1.8rem;
            margin-right: 10px;
        }

        .disclaimer {
            color: #bdc3c7;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: #f1c40f; border-radius: 10px; }

        .loader { 
            display: none; 
            color: #f1c40f; 
            text-align: center; 
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="chat-window">
    <div class="msg ai-msg">كيف أساعدك؟ أنا ابن سينا، فيلسوفك الرقمي.</div>
</div>

<div class="container-bottom">
    <div id="loader" class="loader">جاري التفكير في الرد...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="تحدث مع ابن سينا..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendToAI()">⏎</button>
    </div>
    <div class="disclaimer">ابن سينا هو نموذج ذكاء اصطناعي وقد ينتج عنه أخطاء.</div>
</div>

<script>
    // ضع مفتاح الـ API الخاص بك هنا ليعمل الموقع بدون جهازك
    const API_KEY = "AIzaSyCMUm8Hx6v5dcL49p_cl3Dpcmkzh7bETig"; 

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendToAI();
        }
    }

    async function sendToAI() {
        const inputField = document.getElementById('userInput');
        const chatWindow = document.getElementById('chat-window');
        const loader = document.getElementById('loader');
        const prompt = inputField.value.trim();

        if (!prompt) return;

        addMessage(prompt, 'user-msg');
        inputField.value = '';
        loader.style.display = 'block';

        const aiMsgDiv = document.createElement('div');
        aiMsgDiv.className = 'msg ai-msg';
        chatWindow.appendChild(aiMsgDiv);

        try {
            // استخدام Google Gemini API بدلاً من Ollama للنشر أونلاين
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: "أنت ابن سينا، مساعد تقني ذكي ومباشر. لغتك العربية دقيقة وعصرية. إجاباتك تعتمد على الحقائق فقط وبدون مقدمات أو مبالغات. سؤال المستخدم: " + prompt }]
                    }]
                })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                aiMsgDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                aiMsgDiv.innerText = "معذرة، واجهت مشكلة في صياغة الرد.";
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;

        } catch (error) {
            loader.style.display = 'none';
            aiMsgDiv.innerText = "حدث خطأ في الاتصال بالسيرفر ";
        }
    }

    function addMessage(text, className) {
        const chatWindow = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${className}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
</script>

</body>
</html>
